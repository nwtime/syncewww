{{ define "main" }}
<body style="--bs-body-text-align: center;">
  <section class="min-vh-100 mt-auto">
 <div class="card">
  <div class="card-body">
    <h4 class="card-title" style="color: #1a79c0;  margin-top: 1rem; text-align: center;"><a href="/donate/">Show Your Support by Donating Today!</a></h4>
	<p style="text-align: left;"><b>2025 April Goal:</b><p>
	<div class="progress">
	  <div class="progress-bar" role="progressbar" style="width:8%" aria-valuenow="8" aria-valuemin="0" aria-valuemax="100" style="text-align: left;">$0 of $1,000
	  </div>
	</div>
  </div>
</div>
   <h4>{{ .Title }}</h4>
	<div class="container" style="--bs-body-text-align: start;">
    <p>{{.Content}}</p>
	</div>
	<hr class="mt-5">
</body>
{{ end }}
